<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logarithmic star system</title>
<style>
	html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
	canvas { display: block; touch-action: none; }
	#hud { position: fixed; top: 12px; left: 14px; color: #e3eafa; font: 13px/1.45 system-ui, sans-serif; user-select: none; max-width: min(310px, calc(100vw - 28px)); }
	.panel { background: rgba(10, 15, 27, .86); border: 1px solid #303b52; border-radius: 9px; padding: 12px 14px; }
	.title { font-weight: 650; letter-spacing: .02em; }
	.hint { color: #a8b5cd; margin: 5px 0 10px; font-size: 12px; }
	.controls { display: flex; gap: 6px; }
	select, button { min-width: 0; color: #e6ebf7; background: #202b40; border: 1px solid #485978; border-radius: 5px; padding: 6px 8px; font: inherit; }
	select { flex: 1; } button { cursor: pointer; }
	a { color: #a6c9ff; }
	.status { color: #a8b5cd; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="panel">
	<div class="title">Logarithmic star system</div>
	<div class="hint">Drag space downward to unwrap it. Click a body to follow its surface. Fly Wanderer with WASD or arrow keys.</div>
	<div class="controls"><select id="bodyChoice" aria-label="Choose a body"></select><button id="followBody">Follow</button><button id="resetView">Reset</button></div>
	<div class="status" id="viewStatus">Overview</div>
	<div class="status"><a href="legacy.html">Previous transition demo</a></div>
</div></div>
<script src="log-system.js"></script>
<script src="log-projection.js"></script>
<script src="log-render.js"></script>
<script src="log-input.js"></script>
<script src="log-main.js"></script>
</body>
</html>
